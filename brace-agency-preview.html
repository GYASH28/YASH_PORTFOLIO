<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070908"><title>Brace Agency — Restored Preview</title><style>html,body{margin:0;background:#070908;color:#f1f3eb;min-height:100%}.preview-loading{min-height:100vh;display:grid;place-items:center;font:500 14px system-ui;letter-spacing:.12em;text-transform:uppercase}</style></head><body><div class="preview-loading">Loading restored Brace Agency…</div><script>
(async()=>{
const base='https://raw.githubusercontent.com/GYASH28/YASH_PORTFOLIO/brace-agency-restored/public/';
const names=['c1.txt','c2.txt','c3.txt','c4.txt','c5.txt','c6.txt','c7.txt'];
const b64=(await Promise.all(names.map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})))).join('');
const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const site=JSON.parse(text);
const style=document.createElement('style');style.textContent=site.css;document.head.appendChild(style);
function path(){let h=location.hash.replace(/^#/,'').split('?')[0]||'/';if(!h.startsWith('/'))h='/'+h;h=h.replace(/\/$/,'')||'/';return site.pages[h]?h:'/'}
function render(){const p=path(),m=site.meta[p]||site.meta['/'];document.title=(m?.title||'YKG Digital')+' — Preview';document.body.innerHTML=site.pages[p];document.querySelectorAll('a[href^="/"]').forEach(a=>{const u=new URL(a.getAttribute('href'),location.origin);if(site.pages[u.pathname.replace(/\/$/,'')||'/'])a.href='#'+(u.pathname.replace(/\/$/,'')||'/')+(u.hash||'')});init();scrollTo(0,0)}
function init(){const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)];const progress=$('.progress'),header=$('.topbar');const update=()=>{const h=document.documentElement,p=h.scrollHeight-h.clientHeight?h.scrollTop/(h.scrollHeight-h.clientHeight):0;if(progress)progress.style.transform=`scaleX(${p})`;header?.classList.toggle('scrolled',scrollY>18)};addEventListener('scroll',update,{passive:true});update();const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.1});$$('.reveal').forEach(el=>io.observe(el));const menu=$('.menu'),nav=$('.navlinks');menu?.addEventListener('click',()=>{const o=nav.classList.toggle('open');menu.setAttribute('aria-expanded',o);menu.textContent=o?'✕':'☰'});$$('.compare-wrap').forEach(w=>{const r=$('.compare-range',w),a=$('.after-pane',w),l=$('.compare-line',w),k=$('.compare-knob',w);const set=v=>{const n=Math.max(4,Math.min(96,+v));if(a)a.style.clipPath=`inset(0 0 0 ${n}%)`;if(l)l.style.left=`${n}%`;if(k)k.style.left=`${n}%`};r?.addEventListener('input',e=>set(e.target.value));set(r?.value||52)});$$('a[href^="#/"]').forEach(a=>a.addEventListener('click',e=>{const raw=a.getAttribute('href').slice(1),parts=raw.split('#');const p=parts[0]||'/';if(site.pages[p.replace(/\/$/,'')||'/']){e.preventDefault();location.hash='#'+p;if(parts[1])setTimeout(()=>document.getElementById(parts[1])?.scrollIntoView({behavior:'smooth'}),80)}}));$$('a[href^="#"]:not([href^="#/"])').forEach(a=>a.addEventListener('click',e=>{const id=a.getAttribute('href');if(id==='#')return;const t=$(id);if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth'})}}));if(matchMedia('(pointer:fine)').matches)$$('[data-magnetic]').forEach(el=>{el.addEventListener('mousemove',e=>{const b=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-b.left-b.width/2)*.12}px,${(e.clientY-b.top-b.height/2)*.12}px)`});el.addEventListener('mouseleave',()=>el.style.transform='')});const hero=$('.hero-bg');if(hero&&!matchMedia('(prefers-reduced-motion: reduce)').matches)addEventListener('scroll',()=>hero.style.transform=`scale(1.045) translateY(${Math.min(scrollY*.035,24)}px)`,{passive:true})}
addEventListener('hashchange',render);render();
})().catch(e=>{document.body.innerHTML='<main style="padding:12vw;font:16px system-ui"><h1>Preview failed to initialize.</h1><p>Please refresh once. If it still fails, open the saved ZIP locally.</p></main>';console.error(e)});
</script></body></html>
