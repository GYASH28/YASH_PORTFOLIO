name: V11 install physics refinement

on:
  push:
    branches: [ykg-digital-v11]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v11
      - name: Wire V11 physics assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='  <link rel="stylesheet" href="./v11-physics.css">\n'
          js='  <script src="./v11-physics.js" defer></script>\n'
          if 'v11-physics.css' not in s:
              s=s.replace('</head>',css+'</head>')
          if 'v11-physics.js' not in s:
              s=s.replace('</body>',js+'</body>')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refine(v11): wire elastic scroll physics"
          git push origin HEAD:ykg-digital-v11
