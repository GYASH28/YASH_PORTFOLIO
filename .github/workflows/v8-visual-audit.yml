name: V8 fast visual refinement audit

on:
  push:
    branches: [ykg-digital-v8]
    paths:
      - 'index.html'
      - 'experience.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'qa/v8-visual-audit.mjs'
      - '.github/workflows/v8-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v8.log 2>&1 &
          echo $! >/tmp/v8.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture and inspect key UI sections
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/v8-visual-audit.mjs
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ykg-v8-visual-audit
          path: qa-visual
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        run: kill "$(cat /tmp/v8.pid)" || true
