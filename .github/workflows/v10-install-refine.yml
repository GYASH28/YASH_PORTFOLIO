name: V10 install refinement

on:
  push:
    branches: [ykg-digital-v10]
    paths: ['.github/workflows/v10-install-refine.yml']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v10
          fetch-depth: 0
      - name: Wire refinement assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'v10-refine.css' not in s:
              s=s.replace('<link rel="stylesheet" href="./v10.css">','<link rel="stylesheet" href="./v10.css">\n  <link rel="stylesheet" href="./v10-refine.css">')
          if 'v10-refine.js' not in s:
              s=s.replace('<script src="./v10.js"></script>','<script src="./v10.js"></script><script src="./v10-refine.js"></script>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refine(v10): wire responsive refinement layer'
          git pull --rebase origin ykg-digital-v10
          git push origin HEAD:ykg-digital-v10
