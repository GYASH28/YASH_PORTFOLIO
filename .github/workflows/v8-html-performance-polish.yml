name: V8 one-time HTML performance polish

on:
  push:
    branches: [ykg-digital-v8]
    paths:
      - '.github/workflows/v8-html-performance-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v8
          fetch-depth: 0
      - name: Defer below-the-fold lossless proof media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='src="./assets/desktop-light-home-section-00.png" alt="Current FakhriMart homepage capture" width="1440" height="960" decoding="async"'
          new='src="./assets/desktop-light-home-section-00.png" alt="Current FakhriMart homepage capture" width="1440" height="960" loading="lazy" decoding="async" fetchpriority="low"'
          if old in s:
              s=s.replace(old,new,1)
          # The mobile proof is also below the fold; keep full PNG quality but low priority.
          s=s.replace('src="./assets/mobile-light-home-section-00.png" alt="Current FakhriMart mobile homepage capture" width="390" height="844" loading="lazy" decoding="async"', 'src="./assets/mobile-light-home-section-00.png" alt="Current FakhriMart mobile homepage capture" width="390" height="844" loading="lazy" decoding="async" fetchpriority="low"',1)
          p.write_text(s)
          PY
      - name: Commit performance polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(v8): defer lossless FakhriMart case-study captures'
          git pull --rebase origin ykg-digital-v8
          git push origin HEAD:ykg-digital-v8
