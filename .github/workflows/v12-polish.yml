name: V12 one-shot polish

on:
  push:
    branches: [ykg-digital-v12]
    paths: [.github/workflows/v12-polish.yml]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v12
      - name: Apply visual UX fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('v12.css')
          s=css.read_text()
          old='.work-viewport{position:relative;height:min(68vw,720px);max-height:720px;min-height:520px;overflow:hidden;background:#111718}.work-viewport img{width:100%;height:auto;min-height:100%;object-fit:cover;object-position:top center;transition:opacity .22s ease,transform .35s var(--ease)}'
          new='.work-viewport{position:relative;height:min(62vw,700px);max-height:700px;min-height:500px;overflow:hidden;background:#111718;display:grid;place-items:center}.work-viewport img{width:100%;height:100%;min-height:0;object-fit:cover;object-position:top center;transition:opacity .22s ease,transform .35s var(--ease)}.work-stage.mobile-shot .work-viewport{background:#e9e6de}.work-stage.mobile-shot .work-viewport img{object-fit:contain;object-position:center top}'
          assert old in s
          s=s.replace(old,new)
          start=s.index('.screen-control{')
          end=s.index('.audit{',start)
          s=s[:start]+'.screen-control{display:none}'+s[end:]
          old='.work-tabs{position:static;display:grid;grid-template-columns:repeat(5,1fr);overflow:auto}.work-tab{border:1px solid rgba(255,255,255,.12);min-width:140px}'
          new='.work-tabs{position:static;display:flex;flex-direction:row;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.work-tab{border:1px solid rgba(255,255,255,.12);min-width:150px;scroll-snap-align:start;border-radius:14px}'
          assert old in s
          s=s.replace(old,new)
          s=s.replace('.hero{min-height:auto}', '.hero{min-height:100svh}')
          s=s.replace('.hero-card{padding:20px;border-radius:22px}', '.hero-card{display:none}')
          old='.work-tabs{grid-template-columns:none;display:flex;padding-bottom:4px}.work-tab{min-width:150px;scroll-snap-align:start;border:1px solid rgba(255,255,255,.12);border-radius:14px}'
          if old in s:
              s=s.replace(old,'.work-tabs{display:flex;flex-direction:row;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.work-tab{min-width:150px;scroll-snap-align:start;border:1px solid rgba(255,255,255,.12);border-radius:14px}')
          else:
              s=s.replace('.work-tabs{grid-template-columns:none;display:flex;padding-bottom:4px}', '.work-tabs{display:flex;flex-direction:row;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}')
          css.write_text(s)

          js=Path('v12.js')
          j=js.read_text()
          replacements={
            './assets/v9-fakhri-home-full.png':'./assets/desktop-light-home.png',
            './assets/v9-fakhri-products-full.png':'./assets/desktop-light-catalogue-section-00.png',
            './assets/v9-fakhri-compare-full.png':'./assets/desktop-light-compare.png',
            './assets/v9-fakhri-enquiry-full.png':'./assets/desktop-light-enquiry-section-00.png',
            './assets/v9-fakhri-mobile-home-full.png':'./assets/mobile-light-home-section-00.png'
          }
          for a,b in replacements.items():
              j=j.replace(a,b)
          j=j.replace("workStage?.classList.add('loading');", "workStage?.classList.toggle('mobile-shot',i===4);workStage?.classList.add('loading');")
          js.write_text(j)
          PY
      - name: Commit polish
        run: |
          git config user.name "YKG V12 Polish"
          git config user.email "actions@github.com"
          git add v12.css v12.js
          git commit -m "fix(v12): polish mobile work flow and screenshot presentation"
          git push origin HEAD:ykg-digital-v12
