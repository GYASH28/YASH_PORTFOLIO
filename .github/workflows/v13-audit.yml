name: V13 responsive UI audit

on:
  push:
    branches: [ykg-digital-v13-final]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout V13
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ykg-v13-server.log 2>&1 &
          echo $! > /tmp/ykg-v13-server.pid
          sleep 1
      - name: Run V13 audit
        run: node qa/v13-audit.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ykg-v13-audit
          path: qa-v13
          retention-days: 7
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/ykg-v13-server.pid) 2>/dev/null || true
