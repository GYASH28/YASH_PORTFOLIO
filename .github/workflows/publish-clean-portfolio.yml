name: Publish clean portfolio source

on:
  push:
    branches:
      - portfolio-clean-publish
    paths:
      - .publish-ready

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/chunk-* > /tmp/portfolio-source.b64
          base64 --decode /tmp/portfolio-source.b64 > /tmp/portfolio-source.zip
          echo "0527e437b652ab02923204034c6c108e71feb7000a1885991f1a8e42dd9917c4  /tmp/portfolio-source.zip" | sha256sum --check
          rm -rf /tmp/portfolio-release
          mkdir -p /tmp/portfolio-release
          unzip -q /tmp/portfolio-source.zip -d /tmp/portfolio-release

      - name: Validate complete project
        shell: bash
        working-directory: /tmp/portfolio-release
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/boot-guard.js
          test -f dist/assets/portraits/yash-real-hero.webp
          test -f dist/assets/projects/lernio-ai-home.webp
          ! grep -R "portfolio-source.zip\|FAILED TO FETCH\|fetch(" index.html app.js boot-guard.js

      - name: Replace staging branch with real source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/portfolio-release/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish complete first-party portfolio source"
          git push origin HEAD:portfolio-clean-publish
