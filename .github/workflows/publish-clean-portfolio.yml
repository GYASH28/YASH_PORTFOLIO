name: Publish clean production portfolio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-clean-portfolio.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify clean source
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            https://yash-source-transfer.vercel.app/portfolio.zip \
            --output /tmp/portfolio.zip
          unzip -t /tmp/portfolio.zip

      - name: Replace old project with clean source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/portfolio.zip -d .
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          if find . -path './.git' -prune -o \( -name '*.zip' -o -name '.source-payload' -o -name 'qa' -o -name '.transfer-check*' \) -print | grep -q .; then
            echo 'Temporary files detected in clean source.' >&2
            exit 1
          fi

      - name: Commit clean portfolio
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: publish restored Living Project Gallery'
          git push origin main
