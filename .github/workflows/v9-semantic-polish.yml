name: V9 semantic polish installer
on:
  push:
    branches: [ykg-digital-v9]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v9
          fetch-depth: 0
      - name: Keep V9 markup clean and idempotent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          refine='  <link rel="stylesheet" href="./v9-refine.css" data-v9-refine>\n'
          # Deduplicate the refinement layer, then ensure exactly one follows the hero stylesheet.
          s=s.replace(refine,'')
          s=s.replace('<link rel="stylesheet" href="./v9-hero.css">','<link rel="stylesheet" href="./v9-hero.css">\n'+refine.rstrip())
          s=s.replace('<div class="v9-hero-meta" aria-label="Starting prices">','<div class="v9-hero-meta" role="group" aria-label="Starting prices">')
          s=s.replace('<div class="v9-feature-rail" aria-label="Client-work experience stages">','<div class="v9-feature-rail" role="group" aria-label="Client-work experience stages">')
          s=s.replace('<div class="v9-device-controls" aria-label="Preview device">','<div class="v9-device-controls" role="group" aria-label="Preview device">')
          s=s.replace('<div><small>01 / DISCOVER</small><b>Homepage</b><span>Inspect full resolution ↗</span></div></button>','<span class="v9-shot-meta"><small>01 / DISCOVER</small><b>Homepage</b><span>Inspect full resolution ↗</span></span></button>')
          s=s.replace('<div><small>02 / FIND</small><b>Catalogue</b><span>Inspect full resolution ↗</span></div></button>','<span class="v9-shot-meta"><small>02 / FIND</small><b>Catalogue</b><span>Inspect full resolution ↗</span></span></button>')
          s=s.replace('<div><small>03 / DECIDE</small><b>Compare</b><span>Inspect full resolution ↗</span></div></button>','<span class="v9-shot-meta"><small>03 / DECIDE</small><b>Compare</b><span>Inspect full resolution ↗</span></span></button>')
          s=s.replace('<div><small>04 / ACT</small><b>Enquiry</b><span>Inspect full resolution ↗</span></div></button>','<span class="v9-shot-meta"><small>04 / ACT</small><b>Enquiry</b><span>Inspect full resolution ↗</span></span></button>')
          s=s.replace('<img id="v9ShotDialogImg" alt="">','<img id="v9ShotDialogImg" src="./assets/desktop-light-home-section-00.png" alt="FakhriMart full-resolution capture" loading="lazy" decoding="async">')
          p.write_text(s)
          css=Path('v9-refine.css')
          c=css.read_text()
          marker='.v9-shot-card .v9-shot-meta'
          if marker not in c:
              c += '\n.v9-shot-card .v9-shot-meta{display:block;padding:14px}.v9-shot-card .v9-shot-meta>span{display:block;margin-top:8px;color:var(--v9-mint);font:500 7px var(--v9-mono)}\n'
              css.write_text(c)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html v9-refine.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v9): keep refinement layer and semantic markup stable"
          git pull --rebase origin ykg-digital-v9
          git push origin HEAD:ykg-digital-v9
