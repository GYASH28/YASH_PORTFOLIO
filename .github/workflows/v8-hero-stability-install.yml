name: V8 one-time hero stability install

on:
  push:
    branches: [ykg-digital-v8]
    paths:
      - '.github/workflows/v8-hero-stability-install.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v8
          fetch-depth: 0
      - name: Link hero stability stylesheet after V8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if './v8-hero-stability.css' not in s:
              s=s.replace('<link rel="stylesheet" href="./v8.css" />','<link rel="stylesheet" href="./v8.css" /><link rel="stylesheet" href="./v8-hero-stability.css" />',1)
          p.write_text(s)
          PY
      - name: Commit hero fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(v8): load headline stability layer after motion styles'
          git pull --rebase origin ykg-digital-v8
          git push origin HEAD:ykg-digital-v8
