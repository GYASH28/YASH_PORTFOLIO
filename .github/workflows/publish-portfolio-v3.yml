name: Publish portfolio v3 source

on:
  push:
    branches:
      - portfolio-v3-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract enhanced portfolio
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/portfolio-v3
          mkdir -p /tmp/portfolio-v3
          unzip -q .portfolio-v3-source.zip -d /tmp/portfolio-v3
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/portfolio-v3/. .

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check scripts/build.mjs
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Commit production-ready source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish cinematic portfolio v3"
          git push origin HEAD:portfolio-v3-publish
