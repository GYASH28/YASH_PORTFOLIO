name: V11 immersive UI audit

on:
  push:
    branches: [ykg-digital-v11]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V11
        uses: actions/checkout@v4
        with:
          ref: ykg-digital-v11
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v11.log 2>&1 &
          echo $! >/tmp/v11.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run immersive Playwright audit
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/v11-audit.mjs
      - name: Upload V11 screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ykg-v11-audit
          path: qa-v11
          retention-days: 7
      - name: Stop preview
        if: always()
        run: test -f /tmp/v11.pid && kill "$(cat /tmp/v11.pid)" || true
