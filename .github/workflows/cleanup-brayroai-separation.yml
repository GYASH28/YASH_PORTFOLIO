name: One-time BRAYROAI separation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-brayroai-separation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove migrated BRAYROAI branch from portfolio repository
        run: |
          git push origin --delete brayroai-brand-v1
