name: Inventory preserved portfolio assets

on:
  push:
    branches: [publish-extracted-source-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every branch and reachable object
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --force

          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          ebb34ad5e06d85a074c6f2d3718757bdabc9e731 assets/fonts/barlow-400.woff2
          da60c9a90e758f7924dfac415f24961ee74c59c9 assets/fonts/barlow-600.woff2
          33c8a26ee2cd79dc94efb1b5a0364b250693d47e assets/fonts/barlow-800.woff2
          0dece81f4e183e9b7dd79f9f0a6f97a06c2f89d3 assets/fonts/recursive.woff2
          61fb9d8d9a47768f14f1e0312859f5b451026360 assets/portraits/yash-real-builder.webp
          1d205617c0fa7fcc239a6be41902433ec271fa7a assets/portraits/yash-real-editorial.webp
          ef173bfb71ec62c9d7340b4543f6326252601b52 assets/portraits/yash-real-hero.webp
          786888308d18addddb81c98680f7b2dc92a4838f assets/projects/brace-interface-home.webp
          f885ff7f06ff6b8e9442483a524140a317a121c1 assets/projects/campusmate-home.webp
          b12f64f372c34d3b811c19eb055e15e4f85b717f assets/projects/fakhri-mart-home.webp
          1f2e4fb91f5dfbf882fbf62f741a009db72c89f8 assets/projects/interactive-quiz-home.webp
          71a0524373dd22cc7538751d9ec279b748d0106c assets/projects/lernio-ai-home.webp
          5524609293d5b47ceca65a895b657f6a2539175a assets/projects/yash-portfolio-hero-portrait.webp
          EOF

          echo '=== EXPECTED OBJECT AVAILABILITY ==='
          while read -r sha path; do
            if git cat-file -e "$sha^{blob}" 2>/dev/null; then
              echo "OBJECT_PRESENT $sha $path size=$(git cat-file -s "$sha")"
            else
              echo "OBJECT_MISSING $sha $path"
            fi
          done < "$RUNNER_TEMP/expected.txt"

          echo '=== EXACT PATHS ACROSS BRANCHES ==='
          while read -r sha path; do
            echo "PATH $path expected=$sha"
            git for-each-ref --format='%(refname)' refs/remotes/origin/ | while read -r ref; do
              actual="$(git rev-parse "$ref:$path" 2>/dev/null || true)"
              if [ -n "$actual" ]; then
                echo "  $ref $actual size=$(git cat-file -s "$actual")"
              fi
            done
          done < "$RUNNER_TEMP/expected.txt"

          echo '=== PRESERVED PACKAGES AND ASSET-LIKE FILES ==='
          git for-each-ref --format='%(refname)' refs/remotes/origin/ | while read -r ref; do
            matches="$(git ls-tree -r --name-only "$ref" | grep -E '(^|/)(assets/(fonts|portraits|projects)/|\.release/|\.bundle/|\.migration/|.*\.(zip|tar|tgz|gz|b64|base64)$)' || true)"
            if [ -n "$matches" ]; then
              echo "BRANCH $ref"
              while IFS= read -r path; do
                sha="$(git rev-parse "$ref:$path")"
                echo "  $sha $(git cat-file -s "$sha") $path"
              done <<< "$matches"
            fi
          done
