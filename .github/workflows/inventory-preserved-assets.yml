name: Inventory preserved portfolio assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory complete
        run: echo "Exact binary assets were confirmed absent from reachable Git objects."
