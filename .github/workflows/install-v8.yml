name: Install YKG Digital V8 experience

on:
  push:
    branches: [ykg-digital-v8]
    paths:
      - '.github/workflows/install-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v8
          fetch-depth: 0

      - name: Wire V8 homepage and Experience Lab
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          hero='''<section class="hero-v8" id="top" aria-label="YKG Digital introduction">
      <canvas class="hero-v8-field" id="heroField" aria-hidden="true"></canvas>
      <div class="hero-v8-art" id="heroArt" aria-hidden="true"><img src="./hero-art.svg" alt="" width="1600" height="900" decoding="async" /></div>
      <div class="hero-v8-veil" aria-hidden="true"></div><div class="hero-v8-noise" aria-hidden="true"></div>
      <div class="hero-v8-shell">
        <div class="hero-v8-topline"><p><span class="hero-v8-dot"></span> YKG DIGITAL / PUNE</p><p class="hero-v8-counter"><span>01</span> FIRST IMPRESSION</p></div>
        <div class="hero-v8-copy"><h1 aria-label="Be the obvious choice"><span class="hero-v8-line"><i>Be the</i></span><span class="hero-v8-line hero-v8-accent"><i>obvious choice.</i></span></h1><p class="hero-v8-sub">Custom websites that make the business feel credible, clear and worth contacting <strong>before the first call.</strong></p></div>
        <div class="hero-v8-bottom"><div class="hero-v8-actions"><a class="hero-v8-primary magnetic" href="#plans"><span>See plans</span><b>↓</b></a><a class="hero-v8-text-link" href="./experience.html"><span>Experience the work</span><b>↗</b></a></div><div class="hero-v8-offer"><span>Managed <b>₹2,499/mo</b></span><i></i><span>Own it <b>₹9,999+</b></span></div></div>
      </div>
      <div class="hero-v8-lens-copy" aria-hidden="true"><span>MOVE</span><i></i><span>REVEAL</span></div><div class="hero-v8-scroll" aria-hidden="true"><span>SCROLL TO CHOOSE</span><i></i></div>
    </section>'''
          work='''<section class="work work-v7" id="work">
      <div class="work-pin">
        <div class="work-copy" data-v7-reveal><p class="section-label light">REAL CLIENT WORK / FAKHRIMART</p><div class="work-steps"><article class="work-step active" data-step="0"><small>DISCOVER</small><h2>A catalogue people can actually explore.</h2><p>The current FakhriMart build turns a large product range into a visual storefront instead of another list that needs explaining over chat.</p></article><article class="work-step" data-step="1"><small>FIND</small><h2>Search and filters remove dead ends.</h2><p>Customers can move through categories and product discovery without losing context.</p></article><article class="work-step" data-step="2"><small>DECIDE</small><h2>Comparison supports the buying decision.</h2><p>Shortlisting and comparison bring decision support into the website before the customer reaches WhatsApp.</p></article><article class="work-step" data-step="3"><small>ACT</small><h2>Interest becomes a useful enquiry.</h2><p>The handoff preserves product context so the business gets a better conversation.</p></article></div>
          <div class="case-progress" role="tablist" aria-label="FakhriMart case study stages"><button class="active" type="button" role="tab" aria-selected="true"><small>01</small><b>Homepage</b></button><button type="button" role="tab" aria-selected="false"><small>02</small><b>Catalogue</b></button><button type="button" role="tab" aria-selected="false"><small>03</small><b>Compare</b></button><button type="button" role="tab" aria-selected="false"><small>04</small><b>Enquiry</b></button></div>
          <div class="work-chips"><span>Search</span><span>Compare</span><span>Shortlist</span><span>WhatsApp enquiry</span><span>Responsive</span></div><div class="work-links"><a class="text-link" href="./experience.html">Open the full Experience Lab ↗</a><a class="text-link subtle-link" href="https://fakhriyarns.vercel.app" target="_blank" rel="noopener">Open live client site ↗</a></div></div>
        <div class="case-stage" id="caseStage" data-v7-reveal><div class="case-stage-label"><i></i><div><b>CURRENT AUDITED RELEASE</b><span>LOSSLESS PLAYWRIGHT CAPTURES</span></div></div><div class="case-browser"><div class="browser-bar"><i></i><i></i><i></i><span>fakhriyarns.vercel.app</span><a href="https://fakhriyarns.vercel.app" target="_blank" rel="noopener">OPEN LIVE ↗</a></div><div class="case-canvas"><img class="case-shot active" data-case="home" src="./assets/desktop-light-home-section-00.png" alt="Current FakhriMart homepage capture" width="2880" height="1920" decoding="async" /><img class="case-shot" data-case="catalogue" src="./assets/desktop-light-catalogue-section-00.png" alt="Current FakhriMart catalogue capture" width="2880" height="1920" loading="lazy" decoding="async" /><img class="case-shot" data-case="compare" src="./assets/desktop-light-compare.png" alt="Current FakhriMart compare experience" width="2880" height="1920" loading="lazy" decoding="async" /><img class="case-shot" data-case="enquiry" src="./assets/desktop-light-enquiry-section-00.png" alt="Current FakhriMart enquiry experience" width="2880" height="1920" loading="lazy" decoding="async" /></div></div><div class="case-phone"><img src="./assets/mobile-light-home-section-00.png" alt="Current FakhriMart mobile homepage capture" width="1170" height="2532" loading="lazy" decoding="async" /></div><div class="case-hotspot h1 active">Search by intent</div><div class="case-hotspot h2">Compare choices</div><div class="case-hotspot h3">Enquire with context</div><div class="case-caption"><div><small id="caseCaptionMeta">HOME / PRODUCT DISCOVERY</small><b id="caseCaptionTitle">The storefront explains itself fast.</b></div><span>Scroll or choose a stage ↑</span></div></div>
      </div><div class="work-scroll-space" aria-hidden="true"></div>
    </section>'''

          s=re.sub(r'<section class="hero hero-v5" id="top">.*?</section>',hero,s,count=1,flags=re.S)
          s=re.sub(r'<section class="work" id="work">.*?</section>',work,s,count=1,flags=re.S)
          if './v7.css' not in s: s=s.replace('<link rel="stylesheet" href="./v6.css" />','<link rel="stylesheet" href="./v6.css" />\n  <link rel="stylesheet" href="./v7.css" />\n  <link rel="stylesheet" href="./v8.css" />')
          elif './v8.css' not in s: s=s.replace('<link rel="stylesheet" href="./v7.css" />','<link rel="stylesheet" href="./v7.css" />\n  <link rel="stylesheet" href="./v8.css" />')
          s=s.replace('<body>','<body class="v8">',1)
          if 'class="v7-progress"' not in s: s=s.replace('<body class="v8">','<body class="v8">\n  <div class="v7-progress" aria-hidden="true"><i></i></div><div class="v7-cursor" aria-hidden="true"></div><div class="v7-page-wipe" aria-hidden="true"></div>',1)
          if './v7.js' not in s: s=s.replace('</body>','  <script src="./v7.js"></script>\n  <script src="./v8.js"></script>\n</body>')
          elif './v8.js' not in s: s=s.replace('</body>','  <script src="./v8.js"></script>\n</body>')
          p.write_text(s)

          p=Path('experience.html'); s=p.read_text()
          if './experience-v8.css' not in s: s=s.replace('<link rel="stylesheet" href="./experience-v7.css" />','<link rel="stylesheet" href="./experience-v7.css" />\n  <link rel="stylesheet" href="./experience-v8.css" />')
          if '<body class="exp-v8">' not in s: s=s.replace('<body>','<body class="exp-v8">',1)
          if './experience-v8.js' not in s: s=s.replace('</body>','  <script src="./experience-v8.js"></script>\n</body>')
          p.write_text(s)
          PY

      - name: Commit installed V8
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html experience.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(v8): install researched interactive hero and experience upgrades'
          git pull --rebase origin ykg-digital-v8
          git push origin HEAD:ykg-digital-v8
