name: Enhance BRAYROAI Experience

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agency source branch
        uses: actions/checkout@v4
        with:
          ref: agency-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply BRAYROAI polish and interaction layer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'vercel-import.html';
          let html = fs.readFileSync(file, 'utf8');

          // Idempotent: remove a prior pass before reinjecting.
          html = html.replace(/<!-- BRAYROAI ENHANCEMENTS START -->[\s\S]*?<!-- BRAYROAI ENHANCEMENTS END -->/g, '');

          // Complete the brand migration and metadata cleanup.
          const replacements = [
            ['YKG Digital — Design + Engineering', 'BRAYROAI — Design + Engineering + AI'],
            ['YKG Digital — creative technology studio for web design, development, AI products and interactive experiences led by Yash Ganesh.', 'BRAYROAI — creative technology studio for premium web experiences, product engineering and AI systems led by Yash Ganesh.'],
            ['Creative technology for websites, products, AI and interactive experiences.', 'Premium websites, digital experiences and AI-powered systems built with intent.'],
            ['YKG DIGITAL / NAVIGATION', 'BRAYROAI / NAVIGATION'],
            ['YKG DIGITAL / DESIGN + ENGINEERING', 'BRAYROAI / DESIGN + ENGINEERING + AI'],
            ['YKG / BUILD', 'BRAYROAI / BUILD'],
            ['YKG DIGITAL © 2026', 'BRAYROAI © 2026'],
            ['founder of YKG Digital', 'founder of BRAYROAI'],
            ['YKG Digital is led by Yash Ganesh', 'BRAYROAI is led by Yash Ganesh'],
            ['YKG Digital', 'BRAYROAI'],
            ['YKG DIGITAL', 'BRAYROAI']
          ];
          for (const [from, to] of replacements) html = html.split(from).join(to);

          // Specific visible marks retained as structured typography rather than a blind YKG token replacement.
          html = html.replace(/<span>YKG<\/span><small>DIGITAL<\/small>/g, '<span>BRAYRO</span><small>AI</small>');
          html = html.replace(/<div class="hero-brand-type"><span>YKG<\/span><span>DIGITAL<\/span><\/div>/g, '<div class="hero-brand-type"><span>BRAYRO</span><span>AI</span></div>');
          html = html.replace(/<span>Y<\/span><i>\/<\/i><span>G<\/span>/g, '<span>BR</span><i>/</i><span>AI</span>');
          html = html.replace(/aria-label="YKG home"/g, 'aria-label="BRAYROAI home"');
          html = html.replace(/aria-label="YKG Digital home"/g, 'aria-label="BRAYROAI home"');

          const css = String.raw`
          <style id="brayroai-enhancements">
          :root{
            --brx:50%;--bry:38%;--br-progress:0;--br-section-progress:0;
            --br-electric:#82a8ff;--br-warm:#ff6b2c;--br-soft:#f4efe7;
          }
          html{scroll-padding-top:92px}
          body{overscroll-behavior-y:none}
          body::before{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.18;background:radial-gradient(520px circle at var(--brx) var(--bry),rgba(255,108,44,.11),transparent 58%);transition:opacity .4s ease}
          body.br-is-idle::before{opacity:.07}
          ::selection{background:var(--orange);color:#120600}
          :focus-visible{outline:2px solid var(--orange);outline-offset:5px}

          /* A quieter, useful HUD instead of more decorative clutter. */
          .br-hud{position:fixed;right:18px;bottom:18px;z-index:720;display:grid;grid-template-columns:auto auto;align-items:center;gap:10px;padding:8px 9px 8px 13px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(10,10,8,.70);backdrop-filter:blur(16px) saturate(150%);box-shadow:0 16px 60px rgba(0,0,0,.18);color:#fff;transition:transform .35s var(--ease),opacity .35s var(--ease),border-color .25s}
          .br-hud:hover{border-color:rgba(255,123,56,.55)}
          .br-hud__chapter{font:500 8px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;max-width:132px;overflow:hidden;text-overflow:ellipsis}
          .br-hud__meter{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) calc(var(--br-progress)*1turn),rgba(255,255,255,.11) 0);position:relative}
          .br-hud__meter::after{content:"";position:absolute;inset:4px;background:#12110e;border-radius:50%}
          .br-hud__meter b{position:relative;z-index:1;font:500 7px 'DM Mono',monospace}

          /* Command palette: fast navigation is an interaction, not a gimmick. */
          .br-command-trigger{position:fixed;right:20px;top:92px;z-index:710;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(10,10,8,.52);backdrop-filter:blur(14px);color:rgba(255,255,255,.72);font:500 8px 'DM Mono',monospace;letter-spacing:.08em;transition:transform .25s var(--ease),background .25s,color .25s}
          .br-command-trigger:hover{transform:translateY(-2px);background:rgba(255,77,0,.88);color:#180800}
          .br-command-trigger kbd{font:inherit;padding:2px 5px;border:1px solid currentColor;border-radius:5px;opacity:.7}
          .br-command{position:fixed;inset:0;z-index:1300;display:grid;place-items:start center;padding-top:min(18vh,150px);background:rgba(4,4,3,.58);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s .22s}
          .br-command.open{opacity:1;visibility:visible;transition-delay:0s}
          .br-command__panel{width:min(620px,calc(100% - 32px));padding:12px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:#11100d;color:#f2ede4;box-shadow:0 28px 100px rgba(0,0,0,.45);transform:translateY(-12px) scale(.985);transition:transform .28s var(--ease)}
          .br-command.open .br-command__panel{transform:none}
          .br-command__head{display:flex;align-items:center;gap:10px;padding:10px 11px 13px;border-bottom:1px solid rgba(255,255,255,.1)}
          .br-command__head span{font:500 9px 'DM Mono',monospace;color:rgba(255,255,255,.5)}
          .br-command__head input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:600 16px Manrope,sans-serif}
          .br-command__items{display:grid;padding:7px 0 2px}
          .br-command__item{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;padding:12px;border-radius:14px;text-align:left;color:#fff;transition:background .16s,transform .16s}
          .br-command__item:hover,.br-command__item.active{background:rgba(255,255,255,.09);transform:translateX(2px)}
          .br-command__item b{font:500 9px 'DM Mono',monospace;color:var(--orange)}
          .br-command__item strong{font-size:13px}
          .br-command__item em{font:500 8px 'DM Mono',monospace;color:rgba(255,255,255,.38)}
          .br-command__empty{display:none;padding:24px 12px;text-align:center;color:rgba(255,255,255,.45);font-size:12px}

          /* Active navigation and section choreography. */
          .desktop-nav a{position:relative}
          .desktop-nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:1px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .32s var(--ease)}
          .desktop-nav a[aria-current="location"]::after{transform:scaleX(1)}
          section{position:relative}
          .br-section-line{position:absolute;left:0;top:0;width:100%;height:1px;overflow:hidden;pointer-events:none;opacity:.32}
          .br-section-line::after{content:"";display:block;width:100%;height:100%;background:linear-gradient(90deg,transparent,var(--orange),transparent);transform:translateX(calc(-100% + var(--br-section-progress)*100%));will-change:transform}
          .reveal.br-reveal-ready{filter:blur(7px);transform:translateY(34px) scale(.985);opacity:0}
          .reveal.br-reveal-ready.visible,.reveal.br-reveal-ready.is-visible{filter:none;transform:none;opacity:1;transition:opacity .75s var(--ease),transform .85s var(--ease),filter .65s ease}

          /* Pointer-reactive depth for real content cards. */
          .project-card,.capability-card,.lab-card,.process-card,.proof-card,.service-card,[data-tilt]{--mx:50%;--my:50%;--rx:0deg;--ry:0deg;position:relative;transform-style:preserve-3d;transition:transform .22s ease,border-color .3s ease,box-shadow .3s ease}
          .project-card::after,.capability-card::after,.lab-card::after,.process-card::after,.proof-card::after,.service-card::after,[data-tilt]::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,255,255,.13),transparent 62%);transition:opacity .28s ease}
          .project-card:hover::after,.capability-card:hover::after,.lab-card:hover::after,.process-card:hover::after,.proof-card:hover::after,.service-card:hover::after,[data-tilt]:hover::after{opacity:1}
          .br-tilting{transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px);box-shadow:0 28px 70px rgba(0,0,0,.16)}

          /* Kinetic headlines are restrained to a few degrees. */
          h1,h2{--br-head-x:0px;--br-head-y:0px}
          .br-kinetic{transform:translate3d(var(--br-head-x),var(--br-head-y),0);transition:transform .7s var(--ease)}

          /* Click feedback and micro-details. */
          .br-ripple{position:fixed;width:10px;height:10px;border:1px solid var(--orange);border-radius:50%;pointer-events:none;z-index:1400;transform:translate(-50%,-50%) scale(.2);opacity:.9;animation:brRipple .55s var(--ease) forwards}
          @keyframes brRipple{to{transform:translate(-50%,-50%) scale(7);opacity:0}}
          .br-spark{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--orange);pointer-events:none;z-index:705;animation:brSpark .65s ease-out forwards}
          @keyframes brSpark{to{transform:translate3d(var(--sx),var(--sy),0) scale(0);opacity:0}}
          .button,.nav-cta,.text-link{isolation:isolate;overflow:hidden}
          .button::before,.nav-cta::before{content:"";position:absolute;inset:-2px;z-index:-1;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.2),transparent 70%);transform:translateX(-120%);transition:transform .65s var(--ease)}
          .button:hover::before,.nav-cta:hover::before{transform:translateX(120%)}

          /* Hero ambience tied to pointer and scroll. */
          .hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,rgba(65,118,255,.06),transparent 43%,rgba(255,99,38,.07));mix-blend-mode:screen;opacity:.75;transform:translate3d(calc((var(--brx) - 50%) * .03),calc((var(--bry) - 50%) * .03),0)}
          .hero-brand-type{filter:drop-shadow(0 18px 60px rgba(0,0,0,.16));transition:letter-spacing .65s var(--ease),filter .65s var(--ease)}
          .hero:hover .hero-brand-type{letter-spacing:-.055em;filter:drop-shadow(0 22px 70px rgba(255,77,0,.12))}

          /* Long-page performance. */
          section:not(.hero){content-visibility:auto;contain-intrinsic-size:1px 900px}
          iframe[loading="lazy"]{background:#0d0d0b}

          @media (max-width:760px){
            .br-command-trigger{display:none}.br-hud{right:10px;bottom:10px;padding:7px 7px 7px 10px}.br-hud__chapter{max-width:92px}.br-hud__meter{width:30px;height:30px}
            body::before{display:none}
          }
          @media (pointer:coarse){.br-spark{display:none}.br-tilting{transform:none!important}.project-card::after,.capability-card::after,.lab-card::after,.process-card::after,.proof-card::after,.service-card::after,[data-tilt]::after{display:none}}
          @media (prefers-reduced-motion:reduce){
            *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
            .br-spark,.br-ripple,.br-section-line{display:none!important}.br-kinetic,.br-tilting{transform:none!important}.reveal.br-reveal-ready{filter:none!important;transform:none!important;opacity:1!important}
          }
          </style>`;

          const markup = String.raw`
          <button class="br-command-trigger" type="button" aria-label="Open quick navigation" data-br-command-open><span>QUICK NAV</span><kbd>⌘K</kbd></button>
          <aside class="br-hud" aria-live="polite"><span class="br-hud__chapter">01 / IDENTITY</span><span class="br-hud__meter"><b>0</b></span></aside>
          <div class="br-command" data-br-command aria-hidden="true">
            <div class="br-command__panel" role="dialog" aria-modal="true" aria-label="Quick navigation">
              <div class="br-command__head"><span>BRAYROAI /</span><input data-br-command-input autocomplete="off" spellcheck="false" placeholder="Jump to a section…" aria-label="Filter sections"></div>
              <div class="br-command__items" data-br-command-items></div>
              <div class="br-command__empty" data-br-command-empty>No matching section.</div>
            </div>
          </div>`;

          const js = String.raw`
          <script id="brayroai-enhancements-js">
          (()=>{
            'use strict';
            const d=document, w=window, root=d.documentElement;
            const reduced=w.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const coarse=w.matchMedia('(pointer: coarse)').matches;
            const q=(s,c=d)=>c.querySelector(s), qa=(s,c=d)=>[...c.querySelectorAll(s)];
            const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

            // Ensure media is non-blocking and resilient.
            qa('img').forEach(img=>{ if(!img.hasAttribute('decoding')) img.decoding='async'; });
            qa('iframe').forEach(frame=>{ if(!frame.hasAttribute('loading')) frame.loading='lazy'; frame.setAttribute('title',frame.getAttribute('title')||'Embedded project preview'); });
            qa('a[target="_blank"]').forEach(a=>{const rel=new Set((a.getAttribute('rel')||'').split(/\s+/).filter(Boolean));rel.add('noopener');rel.add('noreferrer');a.setAttribute('rel',[...rel].join(' '));});

            // Intro should impress once, not punish repeat visits.
            const loader=q('.intro-loader');
            try{
              if(loader && sessionStorage.getItem('brayroai-intro-seen')){loader.classList.add('is-done');loader.setAttribute('aria-hidden','true');}
              else if(loader){sessionStorage.setItem('brayroai-intro-seen','1');setTimeout(()=>loader.classList.add('is-done'),1800);}
            }catch(_){ if(loader) setTimeout(()=>loader.classList.add('is-done'),1800); }
            setTimeout(()=>{if(loader){loader.classList.add('is-done');loader.style.pointerEvents='none';}},2600);

            // Global pointer atmosphere, rAF throttled.
            let px=w.innerWidth*.5,py=w.innerHeight*.35,targetX=px,targetY=py,raf=0,idleTimer;
            const pointerFrame=()=>{px+=(targetX-px)*.13;py+=(targetY-py)*.13;root.style.setProperty('--brx',px+'px');root.style.setProperty('--bry',py+'px');raf=0;};
            if(!coarse && !reduced){
              w.addEventListener('pointermove',e=>{targetX=e.clientX;targetY=e.clientY;d.body.classList.remove('br-is-idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>d.body.classList.add('br-is-idle'),1200);if(!raf)raf=requestAnimationFrame(pointerFrame);},{passive:true});
            }

            // Scroll state + useful HUD.
            const hud=q('.br-hud'), hudName=q('.br-hud__chapter'), hudPct=q('.br-hud__meter b');
            const sections=qa('section[id],main section').filter((s,i,a)=>a.indexOf(s)===i);
            sections.forEach(s=>{if(!q(':scope > .br-section-line',s)){const line=d.createElement('i');line.className='br-section-line';line.setAttribute('aria-hidden','true');s.prepend(line);}});
            let lastY=w.scrollY, scrollRaf=0;
            function onScrollFrame(){
              const max=Math.max(1,d.documentElement.scrollHeight-w.innerHeight), p=clamp(w.scrollY/max,0,1);root.style.setProperty('--br-progress',p);
              if(hudPct)hudPct.textContent=Math.round(p*100);
              const probe=w.scrollY+w.innerHeight*.42;
              let active=null;
              sections.forEach((s,i)=>{const top=s.offsetTop, h=s.offsetHeight;if(probe>=top&&probe<top+h){active=s;const sp=clamp((probe-top)/Math.max(h,1),0,1);s.style.setProperty('--br-section-progress',sp);}});
              if(active){
                const label=(q('.eyebrow,.micro',active)?.textContent||active.id||'BRAYROAI').replace(/\s+/g,' ').trim();
                if(hudName)hudName.textContent=label.slice(0,40);
                qa('.desktop-nav a[href^="#"]').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+active.id?'location':'false'));
              }
              const nav=q('.site-nav');const y=w.scrollY;if(nav&&Math.abs(y-lastY)>8){if(y>lastY&&y>180)nav.classList.add('hidden');else nav.classList.remove('hidden');}lastY=y;
              scrollRaf=0;
            }
            w.addEventListener('scroll',()=>{if(!scrollRaf)scrollRaf=requestAnimationFrame(onScrollFrame);},{passive:true});onScrollFrame();

            // Reconcile existing reveal classes with a safer, blur-to-sharp choreography.
            qa('.reveal').forEach(el=>el.classList.add('br-reveal-ready'));
            if('IntersectionObserver' in w){
              const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible','visible');io.unobserve(entry.target);}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
              qa('.reveal.br-reveal-ready').forEach(el=>io.observe(el));
            } else qa('.reveal.br-reveal-ready').forEach(el=>el.classList.add('is-visible','visible'));

            // Card spotlight + subtle physical tilt.
            if(!coarse&&!reduced){
              qa('.project-card,.capability-card,.lab-card,.process-card,.proof-card,.service-card,[data-tilt]').forEach(card=>{
                card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;card.style.setProperty('--mx',x*100+'%');card.style.setProperty('--my',y*100+'%');card.style.setProperty('--ry',((x-.5)*5).toFixed(2)+'deg');card.style.setProperty('--rx',((.5-y)*4).toFixed(2)+'deg');card.classList.add('br-tilting');},{passive:true});
                card.addEventListener('pointerleave',()=>{card.classList.remove('br-tilting');card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');});
              });
            }

            // Kinetic headings respond to viewport position, not every mouse pixel.
            const kinetic=qa('.hero h1,.manifesto h2,.work h2,.about h2,.cta h2').slice(0,8);kinetic.forEach(h=>h.classList.add('br-kinetic'));
            if(!reduced&&'IntersectionObserver' in w){
              const kio=new IntersectionObserver(entries=>entries.forEach(en=>{if(en.isIntersecting){const r=en.target.getBoundingClientRect(),off=clamp((r.top/w.innerHeight-.5)*-8,-6,6);en.target.style.setProperty('--br-head-y',off+'px');}}),{threshold:[0,.5,1]});kinetic.forEach(h=>kio.observe(h));
            }

            // Magnetic actions, restrained to 6px.
            if(!coarse&&!reduced){
              qa('.button,.nav-cta,.text-link').forEach(el=>{
                el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/r.width,y=(e.clientY-(r.top+r.height/2))/r.height;el.style.transform=`translate3d(${(x*6).toFixed(2)}px,${(y*5).toFixed(2)}px,0)`;},{passive:true});
                el.addEventListener('pointerleave',()=>el.style.transform='');
              });
            }

            // Click ripple gives controls tactile feedback.
            d.addEventListener('pointerdown',e=>{if(reduced||!e.target.closest('a,button,[role="button"]'))return;const r=d.createElement('i');r.className='br-ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';d.body.appendChild(r);setTimeout(()=>r.remove(),650);},{passive:true});

            // Very light cursor sparks: capped and throttled.
            let sparkAt=0;
            if(!coarse&&!reduced){w.addEventListener('pointermove',e=>{const now=performance.now();if(now-sparkAt<90)return;sparkAt=now;if(Math.random()>.36)return;const s=d.createElement('i');s.className='br-spark';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--sx',(Math.random()*18-9)+'px');s.style.setProperty('--sy',(Math.random()*24+8)+'px');d.body.appendChild(s);setTimeout(()=>s.remove(),700);},{passive:true});}

            // Quick navigation command palette.
            const command=q('[data-br-command]'),input=q('[data-br-command-input]'),items=q('[data-br-command-items]'),empty=q('[data-br-command-empty]');
            const navItems=qa('.desktop-nav a[href^="#"],.mobile-menu a[href^="#"]').map(a=>({href:a.getAttribute('href'),label:a.textContent.replace(/\d+/g,'').replace(/\s+/g,' ').trim()})).filter((v,i,a)=>v.href&&v.href!=='#'&&a.findIndex(x=>x.href===v.href)===i);
            if(items){navItems.forEach((it,i)=>{const b=d.createElement('button');b.type='button';b.className='br-command__item';b.dataset.href=it.href;b.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><strong>${it.label||it.href.slice(1)}</strong><em>↵</em>`;items.appendChild(b);});}
            let previousFocus=null;
            function setCommand(open){if(!command)return;command.classList.toggle('open',open);command.setAttribute('aria-hidden',String(!open));if(open){previousFocus=d.activeElement;d.body.style.overflow='hidden';setTimeout(()=>input?.focus(),40);}else{d.body.style.overflow='';previousFocus?.focus?.();}}
            q('[data-br-command-open]')?.addEventListener('click',()=>setCommand(true));
            command?.addEventListener('click',e=>{if(e.target===command)setCommand(false);const item=e.target.closest('.br-command__item');if(item){setCommand(false);q(item.dataset.href)?.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});}});
            function filterCommands(){const val=(input?.value||'').toLowerCase().trim();let shown=0;qa('.br-command__item',items||d).forEach(b=>{const ok=!val||b.textContent.toLowerCase().includes(val);b.hidden=!ok;if(ok)shown++;});if(empty)empty.style.display=shown?'none':'block';}
            input?.addEventListener('input',filterCommands);
            d.addEventListener('keydown',e=>{const meta=(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k';if(meta){e.preventDefault();setCommand(!command?.classList.contains('open'));}if(e.key==='Escape'&&command?.classList.contains('open'))setCommand(false);});

            // Anchor navigation: close menu and focus destination after movement.
            qa('a[href^="#"]').forEach(a=>a.addEventListener('click',()=>{const menu=q('.mobile-menu');if(menu?.classList.contains('open')){menu.classList.remove('open');d.body.classList.remove('menu-open');q('.menu-button')?.setAttribute('aria-expanded','false');}}));

            // Mark experience ready only after all enhancement hooks are installed.
            d.documentElement.classList.add('brayroai-ready');
          })();
          </script>`;

          html = html.replace('</head>', `${css}\n</head>`);
          html = html.replace('<body', '<body data-brand="BRAYROAI"');
          html = html.replace('</body>', `<!-- BRAYROAI ENHANCEMENTS START -->${markup}${js}<!-- BRAYROAI ENHANCEMENTS END -->\n</body>`);

          // Static integrity checks.
          const checks = [
            ['brand title', html.includes('BRAYROAI — Design + Engineering + AI')],
            ['hero', html.includes('built to be remembered')],
            ['enhancement CSS', html.includes('id="brayroai-enhancements"')],
            ['command palette', html.includes('data-br-command')],
            ['reduced motion', html.includes('prefers-reduced-motion:reduce')],
            ['founder', html.includes('Yash Ganesh')],
            ['client proof', html.includes('FakhriMart')],
            ['no YKG Digital', !html.includes('YKG Digital')],
          ];
          const failed = checks.filter(([,ok])=>!ok);
          if(failed.length){console.error('Integrity checks failed:',failed.map(x=>x[0]).join(', '));process.exit(1);}
          fs.writeFileSync(file, html);
          fs.writeFileSync('ENHANCEMENT_REPORT.md', [
            '# BRAYROAI Enhancement Pass',
            '',
            '- Brand migration completed in production bundle',
            '- Scroll HUD + active section progress',
            '- Command palette (Ctrl/Cmd+K)',
            '- Pointer-reactive atmosphere',
            '- Card spotlight + restrained 3D tilt',
            '- Magnetic actions + click ripples',
            '- Kinetic headline motion',
            '- Improved reveal choreography',
            '- Repeat-visit intro suppression',
            '- Lazy embed/media hardening',
            '- Accessibility focus and reduced-motion safeguards',
            '- Mobile/coarse-pointer fallbacks',
            '- Long-page content-visibility performance optimization',
            '',
            `Bundle bytes: ${Buffer.byteLength(html)}`,
            `Checks passed: ${checks.length}/${checks.length}`,
          ].join('\n'));
          console.log('Enhanced bundle bytes', Buffer.byteLength(html));
          console.log('All static integrity checks passed');
          NODE

      - name: Commit enhanced agency bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-import.html ENHANCEMENT_REPORT.md
          if git diff --cached --quiet; then
            echo "Enhancement already current"
          else
            git commit -m "feat: polish BRAYROAI motion interactions and resilience"
            git push origin HEAD:agency-v3
          fi
