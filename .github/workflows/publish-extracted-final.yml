name: Final publish of extracted enhanced portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-extracted-portfolio-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out publisher source and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, extract, publish, and deploy source commit
        shell: bash
        run: bash .publisher/final-publish.sh
