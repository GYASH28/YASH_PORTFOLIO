name: V9 wire full-page proof

on:
  push:
    branches: [ykg-digital-v9]
    paths:
      - '.github/workflows/v9-wire-full-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ykg-digital-v9
          fetch-depth: 0
      - name: Replace viewport captures with full-page current proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            './assets/desktop-light-home-section-00.png':'./assets/v9-fakhri-home-full.png',
            './assets/desktop-light-catalogue-section-00.png':'./assets/v9-fakhri-products-full.png',
            './assets/desktop-light-compare.png':'./assets/v9-fakhri-compare-full.png',
            './assets/desktop-light-enquiry-section-00.png':'./assets/v9-fakhri-enquiry-full.png',
            './assets/mobile-light-home-section-00.png':'./assets/v9-fakhri-mobile-home-full.png',
            './assets/desktop-light-home.png':'./assets/v9-fakhri-home-full.png',
          }
          for name in ['index.html','v9-main.js']:
            p=Path(name)
            s=p.read_text()
            for old,new in replacements.items():
              s=s.replace(old,new)
            if name == 'index.html':
              s=s.replace(' width="1440" height="960" decoding="async" fetchpriority="high"',' loading="lazy" decoding="async" fetchpriority="low"')
            p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v9-main.js
          git commit -m 'fix(v9): use full-page lossless proof throughout client experience'
          git pull --rebase origin ykg-digital-v9
          git push origin HEAD:ykg-digital-v9
