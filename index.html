<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07090a" />
  <title>Yash Ganesh — AI Systems, Made Useful</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07090a;color:#f7f5ef;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center;overflow:hidden}
    .boot{width:min(540px,84vw)}
    .boot p{margin:0 0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a7adb0}
    .boot h1{margin:0;font-size:clamp(44px,10vw,92px);line-height:.82;letter-spacing:-.06em;text-transform:uppercase}
    .boot h1 span{color:#ff7626}
    .track{height:2px;margin-top:28px;background:#24282b;overflow:hidden}
    .track i{display:block;width:42%;height:100%;background:linear-gradient(90deg,#5bbaff,#ff7626);animation:load 1.1s ease-in-out infinite alternate}
    .status{margin-top:12px!important;color:#72787b!important}
    @keyframes load{to{transform:translateX(140%)}}
  </style>
  <script defer src="/bootstrap.js"></script>
</head>
<body>
  <main class="boot" aria-live="polite">
    <p>Loading production experience</p>
    <h1>AI systems,<br><span>made useful.</span></h1>
    <div class="track"><i></i></div>
    <p class="status" id="boot-status">Preparing motion, projects and 3D scenes…</p>
  </main>
</body>
</html>
