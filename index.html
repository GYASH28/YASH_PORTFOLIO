<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070908"><style>html,body{margin:0;background:#070908;color:#f1f3eb}body{min-height:100vh}</style></head><body><script>(async()=>{const names=['c1.txt','c2.txt','c3.txt','c4.txt','c5.txt','c6.txt','c7.txt'];const b64=(await Promise.all(names.map(n=>fetch('/'+n).then(r=>r.text())))).join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const site=JSON.parse(text);let p=location.pathname.replace(/\/$/,'')||'/';if(!site.pages[p])p='/';const m=site.meta[p]||site.meta['/'];document.title=m.title;let d=document.querySelector('meta[name=description]');if(!d){d=document.createElement('meta');d.name='description';document.head.appendChild(d)}d.content=m.description;const style=document.createElement('style');style.textContent=site.css;document.head.appendChild(style);document.body.innerHTML=site.pages[p];const script=document.createElement('script');script.textContent=site.js;document.body.appendChild(script)})().catch(e=>{document.body.innerHTML='<main style="padding:10vw;font:16px system-ui"><h1>YKG Digital</h1><p>The site could not initialize. Please refresh.</p></main>';console.error(e)});</script></body></html>
