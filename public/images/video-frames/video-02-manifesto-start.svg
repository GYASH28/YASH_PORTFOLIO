      <stop offset="0" stop-color="#5d4528" stop-opacity=".6"/>
      <stop offset=".44" stop-color="#17130f" stop-opacity=".25"/>
      <stop offset="1" stop-color="#090a0a" stop-opacity="0"/>
    </radialGradient>
